services:
  db:
    # pin U12: postgres:16 + pgvector. The official pgvector image IS postgres:16
    # with the extension compiled in (see ADR-0002).
    image: pgvector/pgvector:pg16
    container_name: us_rag_db
    environment:
      POSTGRES_USER: usrag
      POSTGRES_PASSWORD: usrag
      POSTGRES_DB: usrag
    ports:
      # host 5433: a pre-existing local postgres owns 127.0.0.1:5432 on this machine,
      # and macOS resolves `localhost` to it ahead of Docker's 0.0.0.0 proxy.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usrag -d usrag"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db_data:
