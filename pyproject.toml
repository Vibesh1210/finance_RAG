[project]
name = "us-rag"
version = "0.1.0"
description = "Decision-support RAG over SEC filings, earnings releases, and market data for a 10-company US equity universe"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "lxml>=6.1.1",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
embed = [
    "sentence-transformers>=5.6.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/us_rag"]
